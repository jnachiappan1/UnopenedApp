pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'Unopened_Mobile'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
include ':react-native-push-notification'
project(':react-native-push-notification').projectDir = file('../node_modules/react-native-push-notification/android')

// Ensure all app dependencies can be resolved (Notifee is hosted on its own repo)
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
        maven { url "https://www.jitpack.io" }
        maven { url "https://maven.google.com" }
        // Notifee local maven (bundled in node_modules)
        maven { url uri(new File(rootDir, "../node_modules/@notifee/react-native/android/libs")) }
        // Optional remote repo fallback
        maven { url "https://notifee-maven.s3.amazonaws.com/releases" }
    }
}
